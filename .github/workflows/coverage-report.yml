name: "Coverage Report"
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    name: Comment on pull request
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted workflow configuration
        uses: actions/checkout@v7

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish coverage report
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          file-coverage-mode: all
          json-summary-path: coverage-artifact/coverage/coverage-summary.json
          json-final-path: coverage-artifact/coverage/coverage-final.json
          vite-config-path: coverage-artifact/vitest.config.mjs
