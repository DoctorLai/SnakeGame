name: Update Language Badge

on:
  push:
    branches: ["master"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: language-badge
  cancel-in-progress: true

jobs:
  update:
    name: Calculate JavaScript percentage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update badge data
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const { data } = await github.rest.repos.listLanguages({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const total = Object.values(data).reduce((sum, bytes) => sum + bytes, 0);
            const percentage = total === 0 ? 0 : ((data.JavaScript ?? 0) / total) * 100;
            const badge = {
              schemaVersion: 1,
              label: "JavaScript",
              message: `${percentage.toFixed(1)}%`,
              color: "f1e05a"
            };
            const badgeJson = `{ "schemaVersion": ${badge.schemaVersion}, "label": ${JSON.stringify(badge.label)}, "message": ${JSON.stringify(badge.message)}, "color": ${JSON.stringify(badge.color)} }\n`;
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/javascript.json`, badgeJson);

      - name: Publish badge branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges > /dev/null 2>&1; then
            git fetch origin badges
            git switch --detach origin/badges
          else
            git switch --orphan badges
            git rm -rf --ignore-unmatch .
          fi

          mkdir -p .github/badges
          cp "$RUNNER_TEMP/javascript.json" .github/badges/javascript.json
          git add .github/badges/javascript.json
          if git diff --cached --quiet; then
            echo "JavaScript percentage is unchanged."
            exit 0
          fi

          git commit -m "chore: update language badge"
          git push origin HEAD:badges
